AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ChemicAlly - Serverless Django application

Parameters:
  DomainName:
    Type: String
    Default: chemic-ally.xyz
  CertificateArn:
    Type: String
    Description: ARN of the pre-provisioned ACM certificate in us-east-1 covering DomainName and www (DNS-validated via Cloudflare)
  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy
  RDSDBName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /chemically/rds/db_name
    Description: RDS PostgreSQL database name (from SSM)
  RDSUsername:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /chemically/rds/username
    Description: RDS PostgreSQL username (from SSM)
  RDSHostname:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /chemically/rds/endpoint
    Description: RDS PostgreSQL endpoint hostname (from SSM)
  RDSPort:
    Type: String
    Default: "5432"
    Description: RDS PostgreSQL port

  # Secrets (marked NoEcho)
  RDSPassword:
    Type: String
    NoEcho: true
    Description: RDS PostgreSQL password
  DjangoSecretKey:
    Type: String
    NoEcho: true
    Description: Django SECRET_KEY
  LambdaSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Default: /chemically/lambda/subnet_ids
    Description: Subnet IDs for Lambda VPC (from SSM)
  LambdaVpcId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::VPC::Id>
    Default: /chemically/lambda/vpc_id
    Description: VPC ID for Lambda security group (from SSM)
  EnvironmentVariablesBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /chemically/environment/bucket_name
    Description: S3 bucket name for environment variables (from SSM)

  # ─────────────────────────────────────────────
  # Edge abuse control (M007, R026 / THROT-01)
  #
  # The CloudFront WAF rate limit is NOT declared in this stack. A WAFv2 web
  # ACL with Scope CLOUDFRONT can only be created in us-east-1 ("For
  # CLOUDFRONT, you must create your WAFv2 resources in the US East (N.
  # Virginia) Region, us-east-1" -- AWS::WAFv2::WebACL reference), while this
  # stack deploys to us-east-2 (D015). Declaring the resources here would
  # make every us-east-2 deploy fail on a resource it cannot create.
  #
  # The rule therefore lives in the dedicated us-east-1 edge stack
  # (edge-template.yaml), which takes this stack's CloudFront distribution
  # ARN as a parameter -- see the DistributionArn output below. The edge
  # stack is re-deployed with the current ARN after every app deploy and
  # the deploy job verifies the association still exists, so a detached
  # control can never sit unnoticed.
  # ─────────────────────────────────────────────

  # ─────────────────────────────────────────────
  # CloudFront origin header guard (M006/S03, R029 / THROT-04)
  # ─────────────────────────────────────────────
  # The Function URL is public (Principal "*"), so anybody who learns it can
  # call the app directly and skip CloudFront -- and with it every WAF rule.
  # CloudFront therefore stamps every origin request with a custom header
  # whose value is the shared secret below, and the Django guard refuses any
  # request that does not carry it.
  #
  # The VALUE of OriginSecret is never committed: it lives in CloudFormation
  # (NoEcho) and is supplied by the deploy pipeline. Only the parameter NAME
  # appears in this repository.
  OriginHeaderName:
    Type: String
    Default: X-ChemicAlly-Origin
    MinLength: 1
    Description: >
      Name of the custom header CloudFront stamps on every origin request.
      Must match ORIGIN_HEADER_NAME in config/settings/base.py.
  OriginSecret:
    Type: String
    NoEcho: true
    Description: >
      Shared secret proving a request came through CloudFront. Never commit
      this value: it lives in CloudFormation only.

  # ─────────────────────────────────────────────
  # Origin guard rollout switch (M007/S03, R029 / THROT-04)
  # ─────────────────────────────────────────────
  # The origin header guard has to be rolled out in TWO phases: the
  # CloudFront origin must stamp the header BEFORE anything can refuse a
  # request, or every legitimate request dies. Gating the Lambda
  # environment variable on this boolean makes that order expressible with
  # one secret and one switch:
  #
  #   false (phase 1, default): the header is live, the Lambda environment
  #                             carries NO secret, the guard is inert.
  #   true  (phase 2):          the secret reaches Lambda and the guard
  #                             refuses every request that did not come
  #                             through CloudFront.
  #
  # The switch is owned by the deploy pipeline (one workflow setting), so
  # enforcement starts by one reviewed change and never by accident.
  #
  # CloudFormation has NO Boolean parameter type (cfn-lint enforces this),
  # so the switch is a String restricted to "true"/"false".
  EnforceOriginGuard:
    Type: String
    Default: "false"
    AllowedValues:
      - "true"
      - "false"
    Description: >
      Whether the origin header guard is enforced. false ships the
      CloudFront origin header with the guard inert; true hands the secret
      to Lambda and starts refusing direct Function-URL calls.

  # ─────────────────────────────────────────────
  # Edge web ACL attachment (M007/S06)
  # ─────────────────────────────────────────────
  # The CloudFront rate limit is attached to the distribution through the
  # distribution's own WebACLId, NOT through an
  # AWS::WAFv2::WebACLAssociation. The WAFv2 API does not accept a
  # CloudFront distribution ARN: AWS's own CLI reference for
  # associate-web-acl says "For Amazon CloudFront, call UpdateDistribution
  # for the distribution and provide the Amazon Resource Name (ARN) of the
  # web ACL in the web ACL ID" -- and every ARN shape was rejected live
  # (WAFInvalidParameterException, field: RESOURCE_ARN).
  #
  # So the us-east-1 edge stack creates the web ACL and exports its ARN;
  # this stack attaches that ARN to the distribution. The handover runs the
  # other way round, and neither stack has to know the other's resources.
  #
  # Empty means "no edge rule attached" - the state before the edge stack
  # exists. It is never a silent default: the deploy job always passes the
  # edge stack's live ARN, and the post-deploy verification proves the
  # attachment.
  EdgeWebACLArn:
    Type: String
    Default: ""
    Description: >
      ARN of the us-east-1 edge stack's CloudFront-scoped web ACL, attached
      to the distribution below. Empty means no edge rule is attached yet.

  # ─────────────────────────────────────────────
  # Origin secret fingerprint (M007/S06)
  # ─────────────────────────────────────────────
  # The CloudFront origin header carries the shared origin secret, and
  # CloudFormation's diff does NOT detect a change to a nested list property
  # like Origins.Items[].OriginCustomHeaders: the update is silently
  # dropped, and the live distribution keeps serving without the header.
  #
  # The distribution's Comment is a plain string CloudFormation DOES diff,
  # so it carries a FINGERPRINT of the secret: whenever the secret changes,
  # the Comment changes with it, CloudFormation updates the distribution, and
  # the update carries the full configuration -- including the header. The
  # fingerprint is a truncated hash: it proves WHICH secret is in force
  # without revealing it.
  OriginSecretFingerprint:
    Type: String
    Default: ""
    Description: >
      Truncated hash of the shared origin secret, used only to make the
      distribution's Comment change when the secret changes. It never
      contains any part of the secret itself.

Conditions:
  # CloudFormation has no Boolean parameter type, so the rollout switch is
  # a String restricted to "true"/"false" and turned into a condition here.
  EnforceOriginGuardEnabled: !Equals [!Ref EnforceOriginGuard, "true"]

  # The edge web ACL is attached only when its ARN is known.
  HasEdgeWebACL: !Not [!Equals [!Ref EdgeWebACLArn, ""]]

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Environment:
      Variables:
        DJANGO_SETTINGS_MODULE: config.settings.production
        # CloudFront does not forward the viewer Host header (the Lambda
        # Function URL rejects a Host that is not its own domain), so Django
        # sees the Function URL host. Accept the apex/www hosts plus the
        # regional Function URL namespace. Referencing FunctionUrl directly
        # here would create a circular CloudFormation dependency.
        ALLOWED_HOSTS: !Sub ".${DomainName} .lambda-url.${AWS::Region}.on.aws"
        AWS_STORAGE_BUCKET_NAME: !Ref EnvironmentVariablesBucket
        AWS_S3_REGION_NAME: !Ref AWS::Region
        RDS_DB_NAME: !Ref RDSDBName
        RDS_USERNAME: !Ref RDSUsername
        RDS_PASSWORD: !Ref RDSPassword
        RDS_HOSTNAME: !Ref RDSHostname
        RDS_PORT: !Ref RDSPort
        SECRET_KEY: !Ref DjangoSecretKey
        # M006/S03 (R029): the origin header guard. The same value is set as
        # a CloudFront origin custom header below; a request that does not
        # carry it never came through CloudFront and is refused with 403.
        ORIGIN_HEADER_NAME: !Ref OriginHeaderName
        # M007/S03 (R029): the guard ships in TWO phases. With
        # EnforceOriginGuard=false the secret is NOT in the environment at
        # all (AWS::NoValue removes the variable), so the guard is inert and
        # the first deploy can never refuse legitimate traffic; with it
        # true the secret reaches Lambda and enforcement begins. The header
        # NAME is always deployed, because CloudFront stamps the header
        # from the first deploy onwards.
        ORIGIN_HEADER_SECRET: !If
          - EnforceOriginGuardEnabled
          - !Ref OriginSecret
          - !Ref AWS::NoValue

Resources:
  # ─────────────────────────────────────────────
  # ECR Repository for container images
  # ─────────────────────────────────────────────
  # ─────────────────────────────────────────────
  # Lambda execution role
  # ─────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${EnvironmentVariablesBucket}/*"
                  - !Sub "arn:aws:s3:::${EnvironmentVariablesBucket}"
        # M007/S03 (R029): the origin guard counts every refused direct
        # call as a CloudWatch datapoint, so a caller bypassing CloudFront
        # is a metric (and an alarm) instead of a log line somebody has to
        # grep for. The grant is scoped to the ChemicAlly namespace: the
        # function may publish its own metrics and nothing else.
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource:
                  # CloudWatch's namespace resource is written with a
                  # slash; the colon form is granted as well because the
                  # two spellings are easy to get wrong and an AccessDenied
                  # here would silently cost the milestone its detection
                  # story. Both name the SAME namespace - no wildcard.
                  - !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:namespace/ChemicAlly"
                  - !Sub "arn:aws:cloudwatch:${AWS::Region}:${AWS::AccountId}:namespace:ChemicAlly"

  # ─────────────────────────────────────────────
  # Lambda function (container image)
  # ─────────────────────────────────────────────
  DjangoFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/chemically:${ImageTag}"
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt LambdaSecurityGroup.GroupId
        SubnetIds: !Ref LambdaSubnetIds
    Metadata:
      DockerTag: !Ref ImageTag
      DockerContext: .
      Dockerfile: Dockerfile

  # ─────────────────────────────────────────────
  # Migrator Lambda (D017, R011)
  #
  # Deployed from the same pushed Lambda image as DjangoFunction but runs
  # config.migrate.handler (migrate --noinput + createcachetable) instead of
  # the ASGI handler. Invoked by scripts/run_migrator.py from the deploy job,
  # which only calls it when an RDS instance is actually available (D006:
  # RDS is deliberately absent today, so no unconditional migrate step).
  # No Metadata block needed: the image is built/pushed by CI and deployed
  # via ``sam deploy`` with an explicit ImageUri (no ``sam build``).
  # ─────────────────────────────────────────────
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/chemically:${ImageTag}"
      ImageConfig:
        Command:
          - config.migrate.handler
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt LambdaSecurityGroup.GroupId
        SubnetIds: !Ref LambdaSubnetIds

  # ─────────────────────────────────────────────
  # Lambda Function URL (public endpoint)
  # ─────────────────────────────────────────────
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref DjangoFunction
      AuthType: NONE
      Cors:
        AllowOrigins:
          - !Sub "https://${DomainName}"
          - !Sub "https://www.${DomainName}"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
        AllowHeaders:
          - Content-Type
          - X-CSRFToken
          - Authorization
        MaxAge: 86400

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DjangoFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # A public (AuthType: NONE) function URL needs BOTH lambda:InvokeFunctionUrl
  # and lambda:InvokeFunction. AWS added the second requirement for new function
  # URLs in October 2025; without this statement every request to the URL fails
  # with 403 AccessDeniedException even though the auth-type condition matches.
  # The InvokedViaFunctionUrl condition keeps the grant scoped to URL calls.
  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DjangoFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ─────────────────────────────────────────────
  # Security Group for Lambda VPC access (RDS)
  # ─────────────────────────────────────────────
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Django Lambda function
      VpcId: !Ref LambdaVpcId
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 172.31.0.0/16
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ─────────────────────────────────────────────
  # CloudWatch interface endpoint (M007/S03)
  # ─────────────────────────────────────────────
  # The Lambda publishes the origin guard's refusal metric, and it runs in
  # a VPC whose subnets have no route to the internet. Without a private
  # path to the monitoring API the publish HANGS -- and a hanging publish
  # is on the refusal's critical path, so the refusal itself would time
  # out and the caller would see a 502 instead of the fixed 403.
  #
  # The endpoint gives the function that path. The grant in the role above
  # is scoped to the ChemicAlly namespace, so the function may publish its
  # own metrics and nothing else.
  CloudWatchEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: HTTPS from the Lambda to the CloudWatch endpoint
      VpcId: !Ref LambdaVpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 172.31.0.0/16

  CloudWatchEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref LambdaVpcId
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.monitoring"
      VpcEndpointType: Interface
      SubnetIds: !Ref LambdaSubnetIds
      SecurityGroupIds:
        - !GetAtt CloudWatchEndpointSecurityGroup.GroupId
      # Private DNS is what makes the endpoint USABLE: without it the VPC
      # still resolves monitoring.<region>.amazonaws.com to the PUBLIC
      # address, and the Lambda has no route there -- the publish then fails
      # (and, being on the refusal's critical path, wastes seconds on every
      # refusal).
      PrivateDnsEnabled: true

  # ─────────────────────────────────────────────
  # CloudFront Distribution
  #
  # The ACM certificate (us-east-1, DNS-validated via Cloudflare) is
  # pre-provisioned out of band — see scripts/cloudflare_deploy.py — and
  # supplied as the CertificateArn parameter. Route53 is intentionally not
  # used; DNS for the domain lives in Cloudflare.
  #
  # IDENTITY (M007): the distribution's ARN is what the us-east-1 edge
  # stack associates the WAF rule with, so the distribution must keep its
  # identity across deploys. CloudFormation updates this resource IN PLACE
  # (same logical ID, same distribution ID) for every configuration change,
  # so the ARN is stable across ordinary deploys; it changes only if the
  # stack is deleted and recreated. Note that AWS::CloudFront::Distribution
  # has NO "Name" property (the published CloudFormation resource schema
  # lists only Aliases, Comment, Origins, DefaultCacheBehavior, ... -- a
  # distribution's identity is its ID), so there is no name to pin. The
  # protections that actually matter are therefore: keep this logical ID
  # stable, export the ARN (DistributionArn below), and let the deploy job
  # re-associate and re-verify after every deploy.
  # ─────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        # The fingerprint makes CloudFormation notice a change to the
        # origin header (see the OriginSecretFingerprint parameter).
        Comment: !Sub "ChemicAlly public distribution (us-east-2 app stack) [origin ${OriginSecretFingerprint}]"
        # M007/S06: the edge rate limit is attached HERE, on the
        # distribution, because the WAFv2 API cannot associate a web ACL
        # with a CloudFront distribution ARN. The value is the us-east-1
        # edge stack's web ACL ARN; empty (no edge stack yet) means no rule
        # is attached.
        WebACLId:
          Fn::If:
            - HasEdgeWebACL
            - Ref: EdgeWebACLArn
            - Ref: AWS::NoValue
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        PriceClass: PriceClass_100
        DefaultCacheBehavior:
          TargetOriginId: DjangoLambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          DefaultTTL: 0
          MaxTTL: 0
          MinTTL: 0
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
            # Host is intentionally NOT forwarded: the Lambda Function URL
            # requires Host to equal its own domain and returns 403 otherwise.
            # CloudFront therefore sends the origin domain as Host.
            Headers:
              - Origin
              - Authorization
              - X-CSRFToken
              - CloudFront-Forwarded-Proto
          Compress: true
        Enabled: true
        Origins:
          - Id: DjangoLambda
            DomainName: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            # M006/S03 (R029 / THROT-04): the origin header guard.
            # CloudFront adds this header to EVERY origin request with the
            # shared secret; Django refuses any request that arrives without
            # it, which closes the direct Function-URL bypass around the
            # WAF.
            #
            # The header is deliberately NOT in ForwardedValues.Headers above:
            # legacy forwarding is an allow-list, so a viewer cannot smuggle
            # its own copy of the header to the origin -- CloudFront's value
            # is the only one that arrives.
            OriginCustomHeaders:
              - HeaderName: !Ref OriginHeaderName
                HeaderValue: !Ref OriginSecret
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only

  # ─────────────────────────────────────────────
  # Origin guard refusal alarm (M007/S03, R029 / THROT-04)
  #
  # The Lambda publishes one datapoint per refused direct call into the
  # ChemicAlly namespace (metric OriginGuardRefusals). This alarm is what
  # turns that count into something an operator sees without hunting for
  # it.
  #
  # The alarm lives in the us-east-2 app stack because that is where the
  # Lambda publishes the metric (CloudWatch metrics are regional). It has
  # no SNS action yet: the account has no alert topic, so the alarm is a
  # dashboard-and-API signal until one exists (see OPS_PLAYBOOK.md).
  #
  # Threshold: 5 refusals in 5 minutes. A single refusal is usually a
  # mis-configured client; a burst means somebody is calling the Function
  # URL directly and skipping the WAF.
  # ─────────────────────────────────────────────
  OriginGuardRefusalAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-origin-guard-refusals"
      AlarmDescription: >-
        Direct calls to the Lambda Function URL that the CloudFront origin
        header guard refused - a caller bypassing CloudFront and, with it,
        every WAF rule.
      Namespace: ChemicAlly
      MetricName: OriginGuardRefusals
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  # DNS (apex + www) is managed in Cloudflare, not Route53.
  # See scripts/cloudflare_deploy.py sync-records.

Outputs:
  FunctionUrl:
    Description: Lambda Function URL
    Value: !GetAtt FunctionUrl.FunctionUrl
  CloudFrontDomain:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
  DistributionArn:
    Description: >
      ARN of the CloudFront distribution, in the form the CloudFront API
      reports it (the account field is populated). This is the canonical
      identity of the live distribution: the deploy job and the identity
      verifier compare it against the live distribution.
    Value: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"
  # M007/S06: the WAFv2 web ACL is attached to the distribution through
  # the distribution's WebACLId (see the EdgeWebACLArn parameter), so
  # there is no second ARN shape to export. The canonical, account-bearing
  # DistributionArn above is the live distribution's identity: the deploy
  # job and the identity verifier compare it against the live distribution.
  EcrRepositoryUri:
    Description: ECR repository URI for pushing images
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/chemically"
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DjangoFunction.Arn
  MigrateFunctionArn:
    Description: Migrator Lambda function ARN (R011/D017)
    Value: !GetAtt MigrateFunction.Arn
