name: Diagnose edge association (temporary)

# TEMPORARY diagnostic: try the association with the live distribution's ARN
# against a CLOUDFRONT-scope ACL (us-east-1) and a REGIONAL-scope ACL
# (us-east-2), with several ARN shapes, then delete the throwaway ACLs.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Report the live state
        run: |
          python3 - <<'PY'
          import boto3
          from botocore.exceptions import ClientError

          def client(service, region):
              return boto3.client(service, region_name=region)

          cfn = client("cloudformation", "us-east-2")
          stack = cfn.describe_stacks(StackName="chemically")["Stacks"][0]
          outputs = {o["OutputKey"]: o["OutputValue"] for o in stack["Outputs"]}
          arn = outputs["DistributionArn"]
          dist_id = arn.rsplit("/", 1)[-1]
          print("RESULT stack status:", stack["StackStatus"])
          print("RESULT pipeline arn:", repr(arn))

          waf_e1 = client("wafv2", "us-east-1")
          waf_e2 = client("wafv2", "us-east-2")

          acl_cf = None
          acl_reg = None
          try:
              acl_cf = waf_e1.create_web_acl(
                  Name="chemically-diagnostic-cf",
                  Scope="CLOUDFRONT",
                  DefaultAction={"Allow": {}},
                  VisibilityConfig={
                      "CloudWatchMetricsEnabled": True,
                      "MetricName": "ChemicAllyDiagCf",
                      "SampledRequestsEnabled": False,
                  },
              )["Summary"]["ARN"]
              print("RESULT created cf-scope acl:", acl_cf)
          except ClientError as exc:
              print("RESULT could not create cf-scope acl:",
                    exc.response["Error"]["Message"][:200])

          try:
              acl_reg = waf_e2.create_web_acl(
                  Name="chemically-diagnostic-regional",
                  Scope="REGIONAL",
                  DefaultAction={"Allow": {}},
                  VisibilityConfig={
                      "CloudWatchMetricsEnabled": True,
                      "MetricName": "ChemicAllyDiagReg",
                      "SampledRequestsEnabled": False,
                  },
              )["Summary"]["ARN"]
              print("RESULT created reg-scope acl:", acl_reg)
          except ClientError as exc:
              print("RESULT could not create reg-scope acl:",
                    exc.response["Error"]["Message"][:200])

          variants = [
              ("as-is", arn),
              ("with-region", arn.replace("::", ":us-east-1:")),
              ("colon-resource", arn.replace("/", ":")),
              ("bare-id", dist_id),
          ]
          for label, waf, acl in (
              ("cf-scope/us-east-1", waf_e1, acl_cf),
              ("reg-scope/us-east-2", waf_e2, acl_reg),
          ):
              if not acl:
                  continue
              for name, candidate in variants:
                  try:
                      waf.associate_web_acl(WebACLArn=acl, ResourceArn=candidate)
                      print("RESULT OK", label, name, candidate)
                  except ClientError as exc:
                      print("RESULT FAIL", label, name, candidate,
                            exc.response["Error"]["Message"][:180])

          for waf, acl in ((waf_e1, acl_cf), (waf_e2, acl_reg)):
              if not acl:
                  continue
              try:
                  lock = waf.get_web_acl(WebACLArn=acl)["LockToken"]
                  waf.delete_web_acl(WebACLArn=acl, LockToken=lock)
                  print("RESULT deleted", acl)
              except Exception as exc:
                  print("RESULT could not delete", acl, str(exc)[:160])
          print("RESULT DONE")
          PY
