AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  ChemicAlly edge abuse control - the CloudFront WAF rate limit and its
  association to the live distribution (M007, R026 / THROT-01).

# ─────────────────────────────────────────────
# WHY THIS IS A SEPARATE STACK (read before deploying)
#
# AWS accepts WAFv2 web ACLs with Scope CLOUDFRONT only in us-east-1
# ("For CLOUDFRONT, you must create your WAFv2 resources in the US East
# (N. Virginia) Region, us-east-1" -- AWS::WAFv2::WebACL reference).
# The application stack (Lambda, VPC, RDS) lives in us-east-2 and cannot
# be moved, so the edge control gets its own stack in us-east-1 and takes
# the live distribution's ARN as a parameter (D015, D018).
#
# The distribution itself stays in the us-east-2 app stack: it is not
# recreated, its aliases and certificate do not move, and the Cloudflare
# DNS sync keeps reading the "chemically" stack.
#
# DEPLOY ORDER: the app stack first (it owns the distribution and exports
# DistributionArn), then this stack with that ARN. This stack is re-deployed
# after every app deploy so the association always points at the current
# distribution, and the deploy job verifies the association exists.
#
# CANARY: the rule ships with WafAction=Count. It counts real traffic and
# publishes the EdgeRateLimit CloudWatch metric without touching a single
# request. Switching to Block is a parameter change on this stack, which
# is also the rollback.
#
# The resources below are unconditional on purpose (D015): the stack either
# creates a working rule or the deploy fails loudly. A security control
# that can be deployed in a state where it does nothing is worse than a
# deploy that fails, because the failure is visible and the disablement is
# not.
#
# NOTE ON TEMPLATE STYLE: the intrinsics below are written in their LONG
# form (Ref:, Fn::GetAtt:, Fn::Sub:, Fn::If:, Fn::Equals:) instead of the
# YAML short tags (!Ref, !GetAtt, ...). The short form is idiomatic, but it
# makes the file unreadable by a plain YAML loader (PyYAML raises on the
# unknown tags), and this template is read by tooling as well as by
# CloudFormation -- including the verification that asserts the WafAction
# default is Count. The deployed result is identical either way; keep the
# long form.
# ─────────────────────────────────────────────
Parameters:
  DistributionArn:
    Type: String
    Description: >
      ARN of the live CloudFront distribution, exported by the us-east-2
      app stack as its DistributionArn output. The web ACL is associated
      with exactly this distribution.
  WafRateLimit:
    Type: Number
    Default: 2000
    MinValue: 10
    MaxValue: 2000000000
    Description: >
      Maximum number of requests, per source IP, that the CloudFront WAF
      rate-based rule allows within the 300-second (5 minute) evaluation
      window for the rate-limited paths (HPLC API and the equilibria
      calculator). Exposed as a parameter so the abuse ceiling stays
      reviewable and tunable without editing the template.
  WafAction:
    Type: String
    Default: Count
    AllowedValues:
      - Count
      - Block
    Description: >
      What the rate rule does with a request that trips the limit.
      Count measures the traffic without touching it (the canary, and the
      default for a first deploy); Block refuses the request at the edge
      before it reaches Lambda.

Conditions:
  # The rule's action is the canary switch: Count by default, Block once
  # the count metrics have been reviewed against real traffic.
  #
  # This is the ONLY condition in the stack, and it gates no resource: the
  # web ACL and the association are created unconditionally (D015/D018/
  # D022), so the control either exists and works or the deploy fails
  # loudly. A Fn::FindInMap cannot replace it -- CloudFormation Mappings
  # values must be strings or lists of strings, so a mapping cannot hold
  # the {Block: {}} / {Count: {}} action object the rule's Action property
  # requires.
  UseBlockAction:
    Fn::Equals:
      - Ref: WafAction
      - "Block"

Resources:
  # ─────────────────────────────────────────────
  # CloudFront WAF rate-based rule (D014 shape, M006/S01 -> M007/S01)
  #
  # Abuse is bounded at the edge: a request that trips the rate limit is
  # blocked by WAF before it ever reaches Lambda or the equilibria solver.
  #
  # Scope is deliberately narrow. The rule only counts requests to the
  # HPLC API paths and to the equilibria calculator, so ordinary browsing
  # of the landing page and of the simulator level pages is never
  # throttled. The rule is aggregated per source IP, which is the only
  # aggregation key available to a CloudFront-scoped rule.
  # ─────────────────────────────────────────────
  WafWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name:
        Fn::Sub: "${AWS::StackName}-rate-limit"
      Scope: CLOUDFRONT
      Description: >-
        Edge rate limit for the HPLC API and the equilibria calculator -
        M006/S01, R026.
      DefaultAction:
        Allow: {}
      # Required on the web ACL itself: enables the CloudWatch metric and
      # (sampled) request visibility for the rule below. Sampling is kept
      # off at the ACL level -- only the rule's own sampled-request
      # metric is on, and no request bodies are ever logged.
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: ChemicAllyEdgeWebAcl
        SampledRequestsEnabled: false
      Rules:
        - Name: EdgeRateLimit
          Priority: 0
          # The canary switch: Count (default) measures, Block refuses.
          Action:
            Fn::If:
              - UseBlockAction
              - Block: {}
              - Count: {}
          Statement:
            RateBasedStatement:
              Limit:
                Ref: WafRateLimit
              # 300 s = the 5-minute evaluation window the limit is
              # measured over (AWS WAF allowed values: 60, 120, 300, 600).
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    # HPLC API (simulate, scores, levels, progress).
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /hplc/api/
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
                    # Equilibria calculator (the expensive solver path).
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /calculate/equilibria
                        TextTransformations:
                          - Priority: 0
                            Type: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: EdgeRateLimit
            SampledRequestsEnabled: true

  # The association binds the web ACL to the distribution handed over by the
  # app stack. It references the DistributionArn PARAMETER, never a
  # hard-coded ARN, so the two stacks cannot drift apart silently.
  WafWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      WebACLArn:
        Fn::GetAtt: WafWebACL.Arn
      ResourceArn:
        Ref: DistributionArn

Outputs:
  WebACLArn:
    Description: ARN of the edge web ACL
    Value:
      Fn::GetAtt: WafWebACL.Arn
  WebACLId:
    Description: Id of the edge web ACL
    Value:
      Fn::GetAtt: WafWebACL.Id
  RateLimit:
    Description: The deployed rate limit (requests per IP per 300 s)
    Value:
      Ref: WafRateLimit
  Action:
    Description: The deployed rule action (Count or Block)
    Value:
      Ref: WafAction
