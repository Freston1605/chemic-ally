name: Diagnose the origin guard refusal (temporary)

# TEMPORARY diagnostic: tails the Django function's log group while a direct
# Function-URL call (which the guard refuses) is in flight, so the blocking
# call is visible. Read-only apart from the probe itself.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Tail the function log while the guard refuses
        run: |
          set -uo pipefail
          log_group=$(aws logs describe-log-groups \
            --log-group-name-prefix "/aws/lambda/chemically-DjangoFunction" \
            --query "logGroups[0].logGroupName" --output text)
          echo "log group: ${log_group}"
          ( aws logs tail "$log_group" --since 5m --format short \
              > /tmp/tail.log 2>&1 & echo $! > /tmp/tail.pid )
          sleep 5
          url=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='FunctionUrl'].OutputValue" \
            --output text)
          echo "probing ${url}"
          curl -sS -o /tmp/probe.txt -w 'probe code=%{http_code} time=%{time_total}\n' \
            --max-time 90 "$url" || true
          head -c 200 /tmp/probe.txt || true
          echo
          sleep 5
          kill "$(cat /tmp/tail.pid)" 2>/dev/null || true
          sleep 2
          echo "=== the log (tail) ==="
          tail -40 /tmp/tail.log
          echo "=== the LIVE web ACL (rule shape) ==="
          acl_arn=$(aws cloudformation describe-stacks --stack-name chemically-edge \
            --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='WebACLArn'].OutputValue" \
            --output text)
          echo "acl: ${acl_arn}"
          aws wafv2 get-web-acl --web-acl-arn "$acl_arn" --region us-east-1 \
            --output json 2>&1 | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception as exc:
              print("could not read the ACL:", exc)
              raise SystemExit(0)
          web_acl = data.get("WebACL", {})
          for rule in web_acl.get("Rules", []):
              print(json.dumps(rule, indent=1)[:1500])
          '

          echo "=== the Lambda role's inline policies ==="
          role=$(aws cloudformation describe-stack-resources \
            --stack-name chemically --region us-east-2 \
            --query "StackResources[?ResourceType=='AWS::IAM::Role'].PhysicalResourceId" \
            --output text)
          echo "role: ${role}"
          aws iam list-role-policies --role-name "$role" --output json 2>&1 | head -5
          for policy in $(aws iam list-role-policies --role-name "$role" --query 'PolicyNames' --output text 2>/dev/null); do
            echo "--- policy ${policy}"
            aws iam get-role-policy --role-name "$role" --policy-name "$policy" \
              --output json 2>&1 | head -20
          done

          echo "=== the log (filter-log-events) ==="
          aws logs filter-log-events --log-group-name "$log_group" \
            --start-time $(( ($(date +%s) - 600) * 1000 )) \
            --filter-pattern '?ERROR ?WARNING ?Refused ?refus ?publish ?metric' \
            --output json 2>&1 \
            | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception as exc:
              print("could not read the log:", exc)
              raise SystemExit(0)
          for event in data.get("events", [])[-25:]:
              print(event.get("message", "").strip()[:400])
          '
          echo "=== the last plain events ==="
          aws logs filter-log-events --log-group-name "$log_group" \
            --start-time $(( ($(date +%s) - 600) * 1000 )) \
            --output json 2>&1 \
            | python3 -c '
          import json, sys
          try:
              data = json.load(sys.stdin)
          except Exception as exc:
              print("could not read the log:", exc)
              raise SystemExit(0)
          for event in data.get("events", [])[-15:]:
              print(event.get("message", "").strip()[:300])
          '
          echo "DONE"
