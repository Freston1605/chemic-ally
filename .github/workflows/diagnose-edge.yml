name: Diagnose edge association (temporary)

# TEMPORARY diagnostic: read-only. It reports the state the edge stack's
# WebACLAssociation needs (the live CloudFront distribution, when it was last
# modified, and the template the stack is actually running) so a failed
# association can be diagnosed without touching anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Report the live state
        run: |
          set -uo pipefail
          echo "=== every CloudFront distribution in the account ==="
          aws cloudfront list-distributions --output json \
            | python3 -c '
          import json, sys
          for item in json.load(sys.stdin)["DistributionList"].get("Items", []):
              print("id=%s domain=%s enabled=%s last_modified=%s aliases=%s" % (
                  item.get("Id"), item.get("DomainName"), item.get("Enabled"),
                  item.get("LastModifiedTime"),
                  item.get("Aliases", {}).get("Items")))
          '
          echo
          echo "=== the distribution the stack names (full config) ==="
          dist_id=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionArn'].OutputValue" \
            --output text | sed -e 's#.*distribution/##')
          echo "distribution id from the stack output: ${dist_id}"
          aws cloudfront get-distribution --id "$dist_id" --output json \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["Distribution"]
          cfg = data["DistributionConfig"]
          print("id=%s domain=%s last_modified=%s comment=%r" % (
              data.get("Id"), data.get("DomainName"),
              data.get("LastModifiedTime"), cfg.get("Comment")))
          for origin in cfg.get("Origins", {}).get("Items", []):
              print("origin id=%s domain=%s headers=%r" % (
                  origin.get("Id"), origin.get("DomainName"),
                  origin.get("OriginCustomHeaders")))
          '
          echo
          echo "=== the template the stack is actually running (origin block) ==="
          aws cloudformation get-template --stack-name chemically \
            --region us-east-2 --template-stage Original \
            --query 'TemplateBody' --output text \
            | grep -n -A 6 "OriginCustomHeaders" || echo "NO OriginCustomHeaders IN THE RUNNING TEMPLATE"
          echo
          echo "=== recent stack events for the distribution ==="
          aws cloudformation describe-stack-events --stack-name chemically \
            --region us-east-2 \
            --query "StackEvents[?contains(ResourceName, 'CloudFrontDistribution')].[Timestamp,LogicalResourceId,ResourceType,ResourceStatus]" \
            --output text | head -12
          echo
          echo "=== the edge stack's state (us-east-1) ==="
          aws cloudformation describe-stacks --stack-name chemically-edge \
            --region us-east-1 \
            --query 'Stacks[0].{status:StackStatus,outputs:Outputs}' \
            --output json 2>&1 | head -20
