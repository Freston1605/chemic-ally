name: Diagnose edge association (temporary)

# TEMPORARY diagnostic. It tries the association with several ARN shapes
# against a throwaway web ACL (CLOUDFRONT scope in us-east-1 and REGIONAL
# scope in us-east-2) and deletes every throwaway ACL again at the end.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Report the live state
        run: |
          set -uo pipefail
          dist_id=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionArn'].OutputValue" \
            --output text | sed -e 's#.*distribution/##')
          echo "distribution id: ${dist_id}"

          echo "=== all distributions in the account ==="
          aws cloudfront list-distributions --output json \
            | python3 -c '
          import json, sys
          for item in json.load(sys.stdin)["DistributionList"].get("Items", []):
              print("id=%s domain=%s enabled=%s aliases=%s" % (
                  item.get("Id"), item.get("DomainName"), item.get("Enabled"),
                  item.get("Aliases", {}).get("Items")))
          '

          cleanup() {
            for scope_pair in "CLOUDFRONT us-east-1" "REGIONAL us-east-2"; do
              set -- $scope_pair
              for a in $(aws wafv2 list-web-acls --scope "$1" --region "$2" \
                  --output json --query "WebACLs[?contains(Name, 'chemically-diagnostic')].ARN" \
                  --output text 2>/dev/null); do
                token=$(aws wafv2 get-web-acl --web-acl-arn "$a" --region "$2" \
                  --output json --query 'LockToken' --output text 2>/dev/null)
                aws wafv2 delete-web-acl --web-acl-arn "$a" --lock-token "$token" \
                  --region "$2" >/dev/null 2>&1 && echo "deleted ${a}" || echo "COULD NOT DELETE ${a}"
              done
            done
          }
          trap cleanup EXIT

          cleanup

          cloudfront_acl=$(aws wafv2 create-web-acl \
            --name chemically-diagnostic-cf \
            --scope CLOUDFRONT \
            --default-action '{"Allow": {}}' \
            --visibility-config '{"CloudWatchMetricsEnabled": true, "MetricName": "ChemicAllyDiagCf", "SampledRequestsEnabled": false}' \
            --region us-east-1 --output json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["Summary"]["ARN"])' 2>/dev/null)
          echo "cloudfront-scope acl: ${cloudfront_acl}"

          regional_acl=$(aws wafv2 create-web-acl \
            --name chemically-diagnostic-regional \
            --scope REGIONAL \
            --default-action '{"Allow": {}}' \
            --visibility-config '{"CloudWatchMetricsEnabled": true, "MetricName": "ChemicAllyDiagReg", "SampledRequestsEnabled": false}' \
            --region us-east-2 --output json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["Summary"]["ARN"])' 2>/dev/null)
          echo "regional-scope acl: ${regional_acl}"

          for variant in \
            "arn:aws:cloudfront::768125641662:distribution/${dist_id}" \
            "arn:aws:cloudfront:us-east-1:768125641662:distribution/${dist_id}" \
            "arn:aws:cloudfront::768125641662:distribution:${dist_id}" \
            "${dist_id}" ; do
            echo "--- CLOUDFRONT acl, resource: ${variant}"
            aws wafv2 associate-web-acl --web-acl-arn "$cloudfront_acl" \
              --resource-arn "$variant" --region us-east-1 2>&1 \
              | grep -E "Reason|Parameter|rror" | head -4 || true
            echo "--- REGIONAL acl, resource: ${variant}"
            aws wafv2 associate-web-acl --web-acl-arn "$regional_acl" \
              --resource-arn "$variant" --region us-east-2 2>&1 \
              | grep -E "Reason|Parameter|rror" | head -4 || true
          done

          echo "=== final cleanup ==="
          cleanup
          echo "=== remaining CLOUDFRONT ACLs ==="
          aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 \
            --output json --query 'WebACLs[].Name' || true
          echo "=== remaining REGIONAL ACLs ==="
          aws wafv2 list-web-acls --scope REGIONAL --region us-east-2 \
            --output json --query 'WebACLs[].Name' || true
