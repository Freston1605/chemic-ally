name: Diagnose edge association (temporary)

# TEMPORARY diagnostic. It tries the association with the live
# distribution's ARN against a CLOUDFRONT-scope web ACL (us-east-1) and a
# REGIONAL-scope web ACL (us-east-2), with several ARN shapes, and deletes
# every throwaway ACL again at the end.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Report the live state
        run: |
          python3 - <<'PY'
          import boto3
          from botocore.exceptions import ClientError

          def client(service, region):
              return boto3.client(service, region_name=region)

          cfn = client("cloudformation", "us-east-2")
          stack = cfn.describe_stacks(StackName="chemically")["Stacks"][0]
          outputs = {o["OutputKey"]: o["OutputValue"] for o in stack["Outputs"]}
          arn = outputs["DistributionArn"]
          dist_id = arn.rsplit("/", 1)[-1]
          print("stack status:", stack["StackStatus"])
          print("arn:", repr(arn))
          print("distribution id:", dist_id)

          cf = client("cloudfront", "us-east-1")
          dist = cf.get_distribution(Id=dist_id)["Distribution"]
          print("api arn:", repr(dist.get("ARN")))
          print("api domain:", dist.get("DomainName"), "status:", dist.get("Status"))
          print("api aliases:", dist.get("Aliases"))

          waf_e1 = client("wafv2", "us-east-1")
          waf_e2 = client("wafv2", "us-east-2")

          # Delete leftovers from earlier diagnostic runs.
          for waf, region in ((waf_e1, "us-east-1"), (waf_e2, "us-east-2")):
              for acl in waf.list_web_acls(Scope="CLOUDFRONT" if region == "us-east-1" else "REGIONAL").get("WebACLs", []):
                  if "chemically-diagnostic" not in acl["Name"]:
                      continue
                  try:
                      lock = waf.get_web_acl(WebACLArn=acl["ARN"])["LockToken"]
                      waf.delete_web_acl(WebACLArn=acl["ARN"], LockToken=lock)
                      print("deleted leftover", acl["ARN"])
                  except ClientError as exc:
                      print("could not delete leftover", acl["ARN"],
                            exc.response["Error"]["Message"][:120])

          created = []
          try:
              acl_cf = waf_e1.create_web_acl(
                  Name="chemically-diagnostic-cf",
                  Scope="CLOUDFRONT",
                  DefaultAction={"Allow": {}},
                  VisibilityConfig={
                      "CloudWatchMetricsEnabled": True,
                      "MetricName": "ChemicAllyDiagCf",
                      "SampledRequestsEnabled": False,
                  },
              )["Summary"]["ARN"]
              created.append((waf_e1, acl_cf))
              print("created cloudfront-scope acl:", acl_cf)
          except ClientError as exc:
              print("could not create cloudfront-scope acl:",
                    exc.response["Error"]["Message"][:200])
              acl_cf = None

          try:
              acl_reg = waf_e2.create_web_acl(
                  Name="chemically-diagnostic-regional",
                  Scope="REGIONAL",
                  DefaultAction={"Allow": {}},
                  VisibilityConfig={
                      "CloudWatchMetricsEnabled": True,
                      "MetricName": "ChemicAllyDiagReg",
                      "SampledRequestsEnabled": False,
                  },
              )["Summary"]["ARN"]
              created.append((waf_e2, acl_reg))
              print("created regional-scope acl:", acl_reg)
          except ClientError as exc:
              print("could not create regional-scope acl:",
                    exc.response["Error"]["Message"][:200])
              acl_reg = None

          variants = [
              ("as-is", arn),
              ("with-region", arn.replace("::", ":us-east-1:")),
              ("colon-resource", arn.replace("/", ":")),
              ("bare-id", dist_id),
          ]
          for label, waf, acl in (
              ("cf-scope/us-east-1", waf_e1, acl_cf),
              ("reg-scope/us-east-2", waf_e2, acl_reg),
          ):
              if not acl:
                  continue
              for name, candidate in variants:
                  try:
                      waf.associate_web_acl(WebACLArn=acl, ResourceArn=candidate)
                      print("OK  ", label, name, candidate)
                  except ClientError as exc:
                      print("FAIL", label, name, candidate,
                            exc.response["Error"]["Message"][:180])

          for waf, acl in created:
              try:
                  lock = waf.get_web_acl(WebACLArn=acl)["LockToken"]
                  waf.delete_web_acl(WebACLArn=acl, LockToken=lock)
                  print("deleted", acl)
              except ClientError as exc:
                  print("could not delete", acl,
                        exc.response["Error"]["Message"][:160])
          print("DONE")
          PY
