name: Diagnose edge association (temporary)

# TEMPORARY diagnostic: read-only. It reports the state the edge stack's
# WebACLAssociation needs (the live CloudFront distribution, the caller
# identity, and the web ACLs in us-east-1) so a failed association can be
# diagnosed without touching anything.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Report the live state
        run: |
          set -euo pipefail
          echo "=== caller identity (us-east-2) ==="
          aws sts get-caller-identity
          echo
          echo "=== caller identity (us-east-1) ==="
          aws sts get-caller-identity --region us-east-1
          echo
          echo "=== app stack outputs ==="
          aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query 'Stacks[0].{status:StackStatus,outputs:Outputs,params:Parameters}' \
            --output json
          echo
          echo "=== every CloudFront distribution in the account ==="
          aws cloudfront list-distributions --output json \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["DistributionList"]
          for item in data.get("Items", []):
              print("id=%s domain=%s enabled=%s aliases=%s" % (
                  item.get("Id"), item.get("DomainName"), item.get("Enabled"),
                  item.get("Aliases")))
          '
          echo
          echo "=== the distribution the stack names ==="
          dist_id=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionArn'].OutputValue" \
            --output text | sed -e 's#.*distribution/##')
          echo "distribution id from the stack output: ${dist_id}"
          aws cloudfront get-distribution --id "$dist_id" --output json \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["Distribution"]
          cfg = data["DistributionConfig"]
          print("id=%s domain=%s enabled=%s" % (
              data.get("Id"), data.get("DomainName"), cfg.get("Enabled")))
          for origin in cfg.get("Origins", {}).get("Items", []):
              print("origin domain=%s headers=%s" % (
                  origin.get("DomainName"),
                  [(h.get("HeaderName"), "<value>" if h.get("HeaderValue") else "")
                   for h in origin.get("OriginCustomHeaders", [])]))
          ' || echo "get-distribution FAILED for ${dist_id}"
          echo
          echo "=== CLOUDFRONT web ACLs in us-east-1 ==="
          aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 \
            --output json \
            | python3 -c '
          import json, sys
          for acl in json.load(sys.stdin).get("WebACLs", []):
              print("name=%s id=%s scope=%s" % (
                  acl.get("Name"), acl.get("Id"), acl.get("Scope")))
          '
          echo
          echo "=== a dry-run association against the live distribution ==="
          web_acl=$(aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 \
            --output json --query 'WebACLs[0].ARN' --output text)
          echo "web acl: ${web_acl}"
          arn=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionArn'].OutputValue" \
            --output text)
          echo "resource arn: ${arn}"
          aws wafv2 associate-web-acl --web-acl-arn "$web_acl" --resource-arn "$arn" \
            --region us-east-1 2>&1 | head -20 || true
