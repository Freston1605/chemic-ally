name: Diagnose edge association (temporary)

# TEMPORARY diagnostic. It tries the association with the live
# distribution's ARN against a REGIONAL-scope web ACL (us-east-2) and a
# CLOUDFRONT-scope web ACL (us-east-1), and deletes both afterwards.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Report the live state
        run: |
          dist_id=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionArn'].OutputValue" \
            --output text | sed -e 's#.*distribution/##')
          arn=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionArn'].OutputValue" \
            --output text)
          echo "distribution id: ${dist_id}"
          echo "arn: ${arn}"

          echo "=== delete any leftover diagnostic ACLs ==="
          for a in $(aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 --output json --query "WebACLs[?contains(Name, 'chemically-diagnostic')].ARN" --output text); do
            token=$(aws wafv2 get-web-acl --web-acl-arn "$a" --region us-east-1 --output json --query 'LockToken' --output text)
            aws wafv2 delete-web-acl --web-acl-arn "$a" --lock-token "$token" --region us-east-1 >/dev/null 2>&1 && echo "deleted ${a}"
          done
          for a in $(aws wafv2 list-web-acls --scope REGIONAL --region us-east-2 --output json --query "WebACLs[?contains(Name, 'chemically-diagnostic')].ARN" --output text); do
            token=$(aws wafv2 get-web-acl --web-acl-arn "$a" --region us-east-2 --output json --query 'LockToken' --output text)
            aws wafv2 delete-web-acl --web-acl-arn "$a" --lock-token "$token" --region us-east-2 >/dev/null 2>&1 && echo "deleted ${a}"
          done

          echo "=== REGIONAL-scope ACL (us-east-2) + the distribution ARN ==="
          reg=$(aws wafv2 create-web-acl --name chemically-diagnostic-regional \
            --scope REGIONAL --default-action '{"Allow": {}}' \
            --visibility-config '{"CloudWatchMetricsEnabled": true, "MetricName": "ChemicAllyDiagReg", "SampledRequestsEnabled": false}' \
            --region us-east-2 --output json --query 'Summary.ARN' --output text)
          echo "regional acl: ${reg}"
          aws wafv2 associate-web-acl --web-acl-arn "$reg" --resource-arn "$arn" --region us-east-2 2>&1 | head -8 || true

          echo "=== CLOUDFRONT-scope ACL (us-east-1) + the distribution ARN ==="
          cf=$(aws wafv2 create-web-acl --name chemically-diagnostic-cf \
            --scope CLOUDFRONT --default-action '{"Allow": {}}' \
            --visibility-config '{"CloudWatchMetricsEnabled": true, "MetricName": "ChemicAllyDiagCf", "SampledRequestsEnabled": false}' \
            --region us-east-1 --output json --query 'Summary.ARN' --output text)
          echo "cloudfront acl: ${cf}"
          aws wafv2 associate-web-acl --web-acl-arn "$cf" --resource-arn "$arn" --region us-east-1 2>&1 | head -8 || true

          echo "=== CLOUDFRONT-scope ACL + the distribution ARN with a region ==="
          aws wafv2 associate-web-acl --web-acl-arn "$cf" \
            --resource-arn "arn:aws:cloudfront:us-east-1:768125641662:distribution/${dist_id}" \
            --region us-east-1 2>&1 | head -8 || true

          echo "=== cleanup ==="
          for pair in "us-east-1 CLOUDFRONT ${cf}" "us-east-2 REGIONAL ${reg}"; do
            set -- $pair
            region=$1
            scope=$2
            web_acl=$3
            token=$(aws wafv2 get-web-acl --web-acl-arn "$web_acl" --region "$region" --output json --query 'LockToken' --output text 2>/dev/null)
            if [ -n "$token" ]; then
              aws wafv2 delete-web-acl --web-acl-arn "$web_acl" --lock-token "$token" --region "$region" >/dev/null 2>&1 && echo "deleted ${web_acl}" || echo "COULD NOT DELETE ${web_acl}"
            fi
          done
          echo "=== remaining diagnostic ACLs ==="
          aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 --output json --query 'WebACLs[].Name' || true
          aws wafv2 list-web-acls --scope REGIONAL --region us-east-2 --output json --query 'WebACLs[].Name' || true
          echo "DONE"
