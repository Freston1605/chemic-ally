name: Diagnose edge association (temporary)

# TEMPORARY diagnostic: reports the live distribution's full config, the
# app stack's origin-secret parameter, and the Lambda environment. It only
# reads.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose (read-only)
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Report
        run: |
          python3 - <<'PY'
          import json
          import boto3

          def client(service, region):
              return boto3.client(service, region_name=region)

          cfn = client("cloudformation", "us-east-2")
          stack = cfn.describe_stacks(StackName="chemically")["Stacks"][0]
          outputs = {o["OutputKey"]: o["OutputValue"] for o in stack["Outputs"]}
          params = {p["ParameterKey"]: p["ParameterValue"] for p in stack["Parameters"]}

          print("RESULT stack status:", stack["StackStatus"])
          secret = params.get("OriginSecret", "<missing>")
          print("RESULT OriginSecret parameter: present=%s len=%s value=%r" % (
              "OriginSecret" in params, len(secret), secret))
          print("RESULT OriginHeaderName parameter: %r" % params.get("OriginHeaderName"))
          print("RESULT EnforceOriginGuard parameter: %r" % params.get("EnforceOriginGuard"))

          dist_arn = outputs["DistributionArn"]
          dist_id = dist_arn.rsplit("/", 1)[-1]
          cf = client("cloudfront", "us-east-1")
          dist = cf.get_distribution(Id=dist_id)["Distribution"]
          config = dist["DistributionConfig"]
          print("RESULT distribution last_modified:", dist.get("LastModifiedTime"))
          for origin in config.get("Origins", {}).get("Items", []):
              print("RESULT origin domain:", origin.get("DomainName"))
              print("RESULT origin custom headers:", json.dumps(
                  origin.get("OriginCustomHeaders")))
          print("RESULT distribution WebACLId:", config.get("WebACLId"))

          processed = cfn.get_template(
              StackName="chemically", TemplateStage="Processed"
          )["TemplateBody"]
          import json as _json
          body = _json.dumps(processed)
          for key in ("OriginCustomHeaders", "HeaderValue", "HeaderName"):
              print("RESULT processed template mentions %s: %s" % (
                  key, key in body))
          resources = processed.get("Resources", {})
          dist_template = resources.get("CloudFrontDistribution", {})
          origins = dist_template.get("Properties", {}).get(
              "DistributionConfig", {}).get("Origins", {}).get("Items", [])
          for origin in origins:
              headers = origin.get("OriginCustomHeaders")
              print("RESULT processed template origin headers:", _json.dumps(headers)[:300])
              if headers:
                  for header in headers:
                      value = header.get("HeaderValue")
                      print("RESULT processed HeaderValue len:",
                            len(value) if isinstance(value, str) else value)

          lam = client("lambda", "us-east-2")
          function = outputs["LambdaFunctionArn"].split(":function:")[-1]
          env = lam.get_function_configuration(
              FunctionName=function
          ).get("Environment", {}).get("Variables", {})
          print("RESULT lambda env keys:", sorted(env))
          for key in sorted(env):
              if "SECRET" in key or "ORIGIN" in key:
                  value = env[key]
                  print("RESULT lambda env %s: len=%s" % (key, len(value)))
          print("RESULT DONE")
          PY
