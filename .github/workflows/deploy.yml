name: ChemicAlly CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"
  DJANGO_SETTINGS_MODULE: config.settings.development
  AWS_REGION: us-east-2
  AWS_ACCOUNT_ID: "768125641662"
  ECR_REPOSITORY: chemically
  IMAGE_TAG: ${{ github.run_number }}

jobs:
  # ─────────────────────────────────────────────
  # Stage 1a: Lint (independent)
  # ─────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Lint (Flake8)
        run: flake8 .

      # M007/S01: the app stack and the us-east-1 edge stack are both
      # CloudFormation templates, and a schema error in either one only
      # shows up as an opaque CloudFormation failure at deploy time (the
      # M006 WAF shape carried a singular TextTransformation and an invalid
      # ACL Description). cfn-lint validates both against the published
      # resource schemas before anything is deployed.
      - name: Lint CloudFormation templates (cfn-lint)
        run: cfn-lint template.yaml edge-template.yaml

  # ─────────────────────────────────────────────
  # Stage 1b: Test (independent of lint)
  # ─────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/development.txt

      - name: Set up environment
        run: cp .env.example .env

      # R009: run Django's deployment checklist under the production security
      # posture (config.settings.ci) and promote every WARNING to a failure.
      # Without --fail-level WARNING Django's default fail-level is ERROR, and
      # every deploy check is a warning, so the step would exit 0 no matter how
      # broken the posture is.
      # R016: base.py has no SECRET_KEY fallback and raises
      # ImproperlyConfigured when it is unset. A per-step env var wins over the
      # checked-out .env.example that the "Set up environment" step copies in
      # (base.py uses load_dotenv(override=False)), so these two gates no
      # longer depend on that file's contents.
      - name: Django deploy checks (production settings, fail on warning)
        env:
          DJANGO_SETTINGS_MODULE: config.settings.ci
          SECRET_KEY: ci-only-insecure-key-0123456789-abcdefghij-ABCDEFGHIJ-xyz
        run: python manage.py check --deploy --fail-level WARNING

      # R010: a model change without a matching migration must fail CI instead
      # of shipping silently. Runs under the job-level development settings.
      - name: Manage check (missing migrations)
        env:
          SECRET_KEY: ci-only-insecure-key-0123456789-abcdefghij-ABCDEFGHIJ-xyz
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests (pytest)
        run: |
          pytest -v \
            --cov=hplc_simulator.views \
            --cov=hplc_simulator.serializers \
            --cov=hplc_simulator.exceptions \
            --cov-report=term-missing \
            --cov-fail-under=90

  # ─────────────────────────────────────────────
  # Stage 2: Security Scan
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-lambda.txt
          # Pin the audit tool so the gate does not shift under the workflow.
          # NOTE: OSV/PYSEC advisories evolve over time, so a blocking gate can
          # go red without any code change. That fragility is deliberate and
          # documented (see R008).
          pip install pip-audit==2.10.1
          pip install safety

      # R008: pip-audit is THE dependency gate and must fail the pipeline.
      # Declaration mode (-r) audits exactly what the Lambda image ships (~130
      # deps); env mode would also audit the scan tools' own deps (pip, nltk).
      #
      # --ignore-vuln PYSEC-2026-3827: djangorestframework request.data bypasses
      #   DATA_UPLOAD_MAX_MEMORY_SIZE for large multipart uploads.
      # --ignore-vuln PYSEC-2026-3828: djangorestframework AdminRenderer
      #   information leak on HTTP 400 responses.
      # The DRF pin at 3.15.2 is deliberate (R020/D015). Neither advisory
      # applies here: this API is JSON-only, accepts no file uploads, and never
      # renders AdminRenderer.
      - name: pip-audit (blocking dependency gate)
        run: pip-audit -r requirements/requirements-lambda.txt --format json --output pip-audit-results.json --ignore-vuln PYSEC-2026-3827 --ignore-vuln PYSEC-2026-3828

      # safety check is deprecated and exits 64; it is kept explicitly
      # non-blocking and advisory only. R008 is satisfied by the blocking
      # pip-audit step above.
      - name: Safety check (known vulnerabilities, advisory only)
        run: safety check --output json > safety-results.json || true

      - name: Upload scan results
        uses: actions/upload-artifact@v5
        with:
          name: security-scan-results
          path: |
            pip-audit-results.json
            safety-results.json
          retention-days: 30

  # ─────────────────────────────────────────────
  # Stage 3: Build & Push
  # ─────────────────────────────────────────────
  build:
    name: Build and Push
    runs-on: ubuntu-latest
    needs: [lint, test, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements/*.txt

      - name: Install production dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements-lambda.txt

      - name: Collect static files
        env:
          SECRET_KEY: ${{ secrets.DJANGO_SECRET_KEY }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_STORAGE_BUCKET_NAME: ${{ secrets.AWS_STORAGE_BUCKET_NAME }}
          AWS_S3_REGION_NAME: ${{ env.AWS_REGION }}
        run: python manage.py collectstatic --noinput

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        id: build-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          provenance: false
          sbom: false
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
            ${{ steps.login-ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          no-cache: true

      - name: Upload deploy metadata
        uses: actions/upload-artifact@v5
        with:
          name: deploy-metadata
          path: |
            template.yaml
          retention-days: 7

  # ─────────────────────────────────────────────
  # Stage 4: Deploy
  # ─────────────────────────────────────────────
  deploy:
    name: Deploy to Lambda
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    env:
      # The edge rule's action (M007/S02). Count measures the traffic
      # without touching a single request - the canary mode and the safe
      # default; Block refuses a request that trips the limit at the edge.
      # Switching to Block is ONE reviewed change to this setting, so the
      # edge rule can never start blocking by accident. A manual
      # `sam deploy ... WafAction=Block` is reverted by the next CI run
      # unless this setting is changed at the same time.
      WAF_ACTION: Count
      # The edge stack's name. It is declared once so the deploy step and
      # the verification step can never disagree about which stack holds the
      # CloudFront rate rule.
      EDGE_STACK_NAME: chemically-edge
      # Whether the origin header guard is enforced (M007/S03, R029). false
      # ships the CloudFront origin header with the guard INERT, so the
      # first deploy can never refuse legitimate traffic; true hands the
      # secret to Lambda and starts refusing direct Function-URL calls.
      # Enforcement therefore starts by one reviewed change, in the same
      # order as the header: header first, enforcement second.
      ENFORCE_ORIGIN_GUARD: "false"
    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install deploy helpers
        run: pip install boto3

      # Route53 is not used. The CloudFront custom-domain certificate is
      # DNS-validated through Cloudflare; this step provisions (or reuses)
      # it and writes the validation CNAMEs into the Cloudflare zone.
      - name: Ensure ACM certificate (Cloudflare-validated)
        id: acm
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          arn=$(python scripts/cloudflare_deploy.py \
            ensure-cert --domain chemic-ally.xyz)
          echo "arn=${arn}" >> "$GITHUB_OUTPUT"

      - name: Deploy with SAM
        uses: aws-actions/setup-sam@v2
        with:
          version: 1.*

      # M006/S03 (R029 / THROT-04): the CloudFront origin header guard needs
      # a shared secret. It must never be committed, so it lives in a GitHub
      # secret and is injected as the NoEcho `OriginSecret` SAM parameter.
      # Fail loudly when it is missing: an empty secret would deploy a
      # Lambda whose origin guard is inert, i.e. the Function-URL bypass
      # around the WAF would be back.
      - name: Verify the origin secret is configured
        env:
          ORIGIN_SECRET: ${{ secrets.ORIGIN_SECRET }}
        run: |
          if [ -z "${ORIGIN_SECRET}" ]; then
            echo "::error::The ORIGIN_SECRET GitHub secret is not set. The CloudFront origin header guard (M006/S03, R029) cannot be deployed without it."
            exit 1
          fi

      # ─────────────────────────────────────────────
      # M007/S04: the two-phase rollout is "header first, enforcement
      # second". Before a deploy that would ENFORCE the guard, the origin
      # header must already be live on the live distribution AND settled
      # (CloudFront propagates a configuration change to every edge in "a
      # few minutes"). If it is not, CloudFront would not stamp the header
      # on every edge while the Lambda already refuses header-less
      # requests -- the whole site goes down.
      #
      # The preflight is GATED on the switch, so phase 1 is never blocked
      # by the very header the phase-1 deploy is about to ship. It is NOT
      # swallowable: a preflight that cannot fail the job is a comment.
      # The witness is read-only (boto3 is already installed by the
      # deploy-helpers step above).
      # ─────────────────────────────────────────────
      - name: "Preflight: the origin header must be live before enforcement"
        if: env.ENFORCE_ORIGIN_GUARD == 'true'
        run: |
          python scripts/verify_origin_guard.py \
            --stack-name chemically \
            --region ${{ env.AWS_REGION }} \
            --expect header-live

      - name: Read the live edge rule action
        id: edge-action
        run: |
          set -uo pipefail

          live_action=""
          stack_absent="false"
          output=""
          if ! output=$(aws cloudformation describe-stacks \
            --stack-name "$EDGE_STACK_NAME" --region us-east-1 \
            --query "Stacks[0].Parameters[?ParameterKey=='WafAction'].ParameterValue" \
            --output text 2>&1); then
            if printf '%s' "$output" | grep -qi "does not exist"; then
              stack_absent="true"
            else
              echo "::error::Could not read the live WafAction of the edge stack ${EDGE_STACK_NAME}; the deploy cannot tell whether it flips the rule."
              printf '%s\n' "$output"
              exit 1
            fi
          else
            live_action=$(printf '%s' "$output" | tr -d '[:space:]')
          fi

          if [ "$stack_absent" = "true" ]; then
            changed="true"
            echo "The edge stack ${EDGE_STACK_NAME} does not exist yet: this run creates the rule, so the action counts as changed."
          elif [ -z "$live_action" ] || [ "$live_action" = "None" ]; then
            changed="true"
            echo "::warning::The edge stack ${EDGE_STACK_NAME} does not report a WafAction parameter value; treating the action as changed."
          elif [ "$live_action" = "$WAF_ACTION" ]; then
            changed="false"
          else
            changed="true"
          fi

          echo "waf_action_changed=${changed}" >> "$GITHUB_OUTPUT"
          echo "Edge rule action: live=${live_action:-none} wanted=${WAF_ACTION} changed=${changed}"

      - name: Deploy the edge stack (us-east-1)
        run: |
          set -euo pipefail

          echo "Deploying the edge stack (action: ${WAF_ACTION})"

          sam deploy \
            --template-file edge-template.yaml \
            --stack-name "$EDGE_STACK_NAME" \
            --region us-east-1 \
            --parameter-overrides \
              WafRateLimit=2000 \
              WafAction="$WAF_ACTION" \
            --no-fail-on-empty-changeset

      # The web ACL the edge stack just created (or updated) is what the
      # app stack attaches to the distribution through the distribution's
      # WebACLId. The ARN is read from the edge stack's own output -- never
      # written down here -- so the two stacks cannot drift apart.
      - name: Read the edge web ACL ARN
        id: edge-acl
        run: |
          set -euo pipefail
          acl_arn=$(aws cloudformation describe-stacks \
            --stack-name "$EDGE_STACK_NAME" --region us-east-1 \
            --query "Stacks[0].Outputs[?OutputKey=='WebACLArn'].OutputValue" \
            --output text)
          if [ -z "$acl_arn" ] || [ "$acl_arn" = "None" ]; then
            echo "::error::The edge stack ${EDGE_STACK_NAME} did not export WebACLArn; the distribution cannot be attached to the rate rule."
            exit 1
          fi
          echo "arn=${acl_arn}" >> "$GITHUB_OUTPUT"
          echo "Edge web ACL: ${acl_arn}"

      - name: SAM deploy
        run: |
          sam deploy \
            --template-file template.yaml \
            --stack-name chemically \
            --capabilities CAPABILITY_IAM \
            --region ${{ env.AWS_REGION }} \
            --image-repository ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }} \
            --parameter-overrides \
              ImageTag=${{ env.IMAGE_TAG }} \
              CertificateArn=${{ steps.acm.outputs.arn }} \
              RDSPassword=${{ secrets.RDS_PASSWORD }} \
              DjangoSecretKey=${{ secrets.DJANGO_SECRET_KEY }} \
              OriginSecret=${{ secrets.ORIGIN_SECRET }} \
              EnforceOriginGuard=${{ env.ENFORCE_ORIGIN_GUARD }} \
              EdgeWebACLArn=${{ steps.edge-acl.outputs.arn }} \
            --no-fail-on-empty-changeset

      # ─────────────────────────────────────────────
      # M007/S05: the edge canary is CI-owned, so the deploy job must know
      # whether THIS run flips the rule. The flip is the only moment a
      # Block-mode probe is worth running: a steady-state Block deploy
      # must not burst the live site for no new information.
      #
      # The live action is read from the edge stack's OWN parameters before
      # the deploy overwrites them, and compared with the workflow's
      # WAF_ACTION setting. The result is published as the step output
      # `waf_action_changed`.
      #
      # A stack that does not exist yet means this run CREATES the rule:
      # there is no previous action to compare with, so the action counts
      # as changed. EVERY other AWS failure (throttling, a lost
      # connection) must fail the job: a read error must never be
      # mistaken for "the action did not change", because that would
      # silently skip the proof of the flip.
      # ─────────────────────────────────────────────
      # ─────────────────────────────────────────────
      # M007/S02: the edge stack (us-east-1).
      #
      # AWS accepts WAFv2 web ACLs with Scope CLOUDFRONT only in us-east-1,
      # while the app stack deploys to us-east-2 (D015/D018), so the CloudFront
      # rate limit lives in its own stack: `chemically-edge`.
      #
      # The distribution ARN is read from the app stack we JUST deployed, so
      # the association can never point at a stale distribution - the edge
      # stack is re-deployed after every app deploy for exactly that reason.
      # The credentials are account-wide, so only the region differs.
      # ─────────────────────────────────────────────
      # A detached association is a security control that looks deployed and
      # is not: the edge stack must be bound to the distribution that is
      # actually live. This check is read-only and fails the job loudly.
      - name: Verify the edge association
        run: |
          python scripts/verify_edge.py \
            --app-stack-name chemically \
            --app-region "${{ env.AWS_REGION }}" \
            --edge-stack-name "${{ env.EDGE_STACK_NAME }}" \
            --edge-region us-east-1

      # Point the apex and www records at the (possibly recreated) CloudFront
      # distribution. A rebuilt stack gets a new *.cloudfront.net domain, so
      # this must run after every deploy.
      - name: Sync Cloudflare DNS records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          python scripts/cloudflare_deploy.py sync-records \
            --domain chemic-ally.xyz --stack chemically

      # R011/D017: deliver prod migrations via the MigrateFunction Lambda.
      # boto3 is already installed by the deploy-helpers step. The script
      # gates on RDS availability (D006: today it prints "RDS absent (D006)
      # - migrations skipped" and exits 0); when RDS is available it invokes
      # the migrator Lambda and fails the job if the payload is not ok —
      # `aws lambda invoke` exits 0 even when the function throws, so the
      # payload must be inspected explicitly.
      - name: Run migrator (gated on RDS availability, D006/D017)
        run: |
          python scripts/run_migrator.py \
            --stack-name chemically \
            --region ${{ env.AWS_REGION }}

      # R012: real infra verification, run as its own attributable step.
      # Replaces the old `aws lambda get-function --function-name ...-* ||
      # echo` decoration, which could never fail the job. The script requires
      # a healthy terminal stack status, the LambdaFunctionArn Output, an
      # ImageTag equal to this run's tag (a normal deploy always advances it,
      # so a stale or skipped deploy cannot pass), and Active/Successful
      # function configs. boto3 is already installed by the deploy-helpers
      # step. The live app probe is a separate job (live-probe) so an
      # application regression is not confused with an
      # infrastructure-verification failure.
      - name: Verify deployment
        run: |
          python scripts/verify_deploy.py \
            --stack-name chemically \
            --region ${{ env.AWS_REGION }} \
            --expect-tag ${{ env.IMAGE_TAG }}

      # ─────────────────────────────────────────────
      # M007/S04: the post-deploy witness. It proves which phase is
      # actually live: in phase 1 the header is live and the guard is
      # inert; in phase 2 a direct Function-URL call is refused with the
      # fixed 403 body and counted in the ChemicAlly/OriginGuardRefusals
      # metric while the public site still serves 200 (no legitimate
      # request was refused).
      #
      # It runs AFTER the Cloudflare DNS sync (the public-site probe has to
      # hit the live alias) and AFTER the deployment check. It is not
      # swallowable.
      #
      # --min-header-age-minutes 0: the "settled across the edges" window
      # is a PRE-DEPLOY gate (the preflight above), not a post-deploy
      # assertion. This step runs immediately after a deploy that may
      # itself have changed the distribution -- phase 1 ships the header,
      # so the distribution was modified seconds ago -- and demanding a
      # 10-minute-old distribution here would turn every phase-1 deploy
      # red for a reason that has nothing to do with the guard.
      # ─────────────────────────────────────────────
      - name: Verify the origin guard rollout
        run: |
          python scripts/verify_origin_guard.py \
            --stack-name chemically \
            --region ${{ env.AWS_REGION }} \
            --site-url https://chemic-ally.xyz \
            --expect auto \
            --expect-enforcement ${{ env.ENFORCE_ORIGIN_GUARD }} \
            --min-header-age-minutes 0

      # ─────────────────────────────────────────────
      # M007/S05: the edge canary, owned by CI.
      #
      # Count mode: the observer is READ-ONLY. It reads the live rule (the
      # LIVE web ACL, not the stack parameter), the WAF counters for the
      # window, and the ordinary site's status, and writes a JSON record.
      # It runs on every Count deploy, because that is where the canary
      # window's evidence comes from.
      #
      # Block mode: the probe is the PROOF of the flip. It sends a bounded,
      # paced burst at a cheap read-only path inside the rule's scope and
      # proves the edge refused the request before the origin ever saw it.
      # It fires ONLY when this run actually changed the action, so a
      # steady-state Block deploy does not burst the live site.
      #
      # Neither step may be swallowed (|| true / continue-on-error): a
      # canary that cannot fail the job is a comment.
      # ─────────────────────────────────────────────
      - name: Observe the edge canary (Count mode)
        id: observe-canary
        if: env.WAF_ACTION == 'Count'
        run: |
          python scripts/verify_edge_canary.py \
            --edge-stack-name "${{ env.EDGE_STACK_NAME }}" \
            --edge-region us-east-1 \
            --expect-action Count \
            --minutes 1440 \
            --site-url https://chemic-ally.xyz \
            --record-out edge-canary-count-record.json

      - name: Upload the edge canary record (Count mode)
        if: always() && steps.observe-canary.outcome != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: edge-canary-count-record
          path: edge-canary-count-record.json
          if-no-files-found: warn
          retention-days: 30

      # The probe must be the LAST EXECUTABLE step of the job: it
      # deliberately trips the rate limit for the runner's own address, and
      # nothing that runs after it may be affected by that.
      - name: Prove the edge block (Block mode)
        id: probe-block
        if: env.WAF_ACTION == 'Block' && steps.edge-action.outputs.waf_action_changed == 'true'
        run: |
          python scripts/verify_edge_block.py \
            --edge-stack-name "${{ env.EDGE_STACK_NAME }}" \
            --edge-region us-east-1 \
            --site-url https://chemic-ally.xyz \
            --path /hplc/api/levels/ \
            --confirm-live \
            --record-out edge-canary-block-record.json

      - name: Upload the edge block record (Block mode)
        if: always() && steps.probe-block.outcome != 'skipped'
        uses: actions/upload-artifact@v5
        with:
          name: edge-canary-block-record
          path: edge-canary-block-record.json
          if-no-files-found: warn
          retention-days: 30

  # ─────────────────────────────────────────────
  # Stage 5: Live production probe
  # ─────────────────────────────────────────────
  # R012: the deploy gate is not done until the real production site answers.
  # This job runs only after the SAM deploy job (stack update + DNS sync +
  # migrator + infra verification) succeeds and requests the deployed site:
  # the apex must serve HTTP 200 and the trailing-slash /hplc/ route must
  # serve HTTP 200 (scripts/live_probe.py asserts both, plus deeper
  # browser-shaped checks, and exits non-zero — failing this job and the
  # whole workflow run — if any check fails). A separate job keeps an
  # application-level failure visibly distinct from an infrastructure
  # verification failure in the run's job list.
  live-probe:
    name: Live production probe
    runs-on: ubuntu-latest
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      # live_probe.py is stdlib-only (urllib), so no pip install is needed.
      - name: Probe deployed site (chemic-ally.xyz)
        run: python scripts/live_probe.py
