name: Diagnose edge association (temporary)

# TEMPORARY diagnostic. The first part is READ-ONLY. The second part creates
# ONE throwaway CloudFront-scoped web ACL in us-east-1, tries the
# association with the ARN the pipeline passes, prints the API's answer, and
# deletes the throwaway ACL again -- exactly what the edge stack does, and
# it cleans up after itself.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose (read-only + one throwaway ACL)
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Report the live state
        run: |
          set -uo pipefail
          echo "=== the API's own ARN for the distribution ==="
          dist_id=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionArn'].OutputValue" \
            --output text | sed -e 's#.*distribution/##')
          aws cloudfront get-distribution --id "$dist_id" --output json \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["Distribution"]
          print("id=%s" % data.get("Id"))
          print("arn=%s" % data.get("ARN"))
          print("status=%s" % data.get("Status"))
          print("domain=%s" % data.get("DomainName"))
          print("last_modified=%s" % data.get("LastModifiedTime"))
          '
          echo
          echo "=== the ARN the pipeline passes ==="
          arn=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionArn'].OutputValue" \
            --output text)
          echo "pipeline arn=${arn}"
          echo
          echo "=== throwaway ACL + association attempt ==="
          acl=$(aws wafv2 create-web-acl \
            --name chemically-diagnostic-association \
            --scope CLOUDFRONT \
            --default-action '{"Allow": {}}' \
            --visibility-config '{"CloudWatchMetricsEnabled": true, "MetricName": "ChemicAllyDiagnostic", "SampledRequestsEnabled": false}' \
            --region us-east-1 --output json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["Summary"]["ARN"])')
          echo "throwaway acl=${acl}"
          echo "--- associating with the pipeline ARN ---"
          aws wafv2 associate-web-acl --web-acl-arn "$acl" --resource-arn "$arn" \
            --region us-east-1 2>&1 | head -12
          echo "--- associating with the API's own ARN ---"
          api_arn=$(aws cloudfront get-distribution --id "$dist_id" --output json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["Distribution"]["ARN"])')
          echo "api arn=${api_arn}"
          aws wafv2 associate-web-acl --web-acl-arn "$acl" --resource-arn "$api_arn" \
            --region us-east-1 2>&1 | head -12
          echo "--- cleaning up the throwaway ACL ---"
          aws wafv2 delete-web-acl --web-acl-arn "$acl" --lock-token "$(
            aws wafv2 get-web-acl --web-acl-arn "$acl" --region us-east-1 --output json \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["LockToken"])')" \
            --region us-east-1 2>&1 | head -5
          echo "--- remaining CLOUDFRONT ACLs ---"
          aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 \
            --output json --query 'WebACLs[].Name'
