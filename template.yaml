AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: ChemicAlly - Serverless Django application

Parameters:
  DomainName:
    Type: String
    Default: chemic-ally.xyz
  CertificateArn:
    Type: String
    Description: ARN of the pre-provisioned ACM certificate in us-east-1 covering DomainName and www (DNS-validated via Cloudflare)
  ImageTag:
    Type: String
    Default: latest
    Description: Docker image tag to deploy
  RDSDBName:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /chemically/rds/db_name
    Description: RDS PostgreSQL database name (from SSM)
  RDSUsername:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /chemically/rds/username
    Description: RDS PostgreSQL username (from SSM)
  RDSHostname:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /chemically/rds/endpoint
    Description: RDS PostgreSQL endpoint hostname (from SSM)
  RDSPort:
    Type: String
    Default: "5432"
    Description: RDS PostgreSQL port

  # Secrets (marked NoEcho)
  RDSPassword:
    Type: String
    NoEcho: true
    Description: RDS PostgreSQL password
  DjangoSecretKey:
    Type: String
    NoEcho: true
    Description: Django SECRET_KEY
  LambdaSubnetIds:
    Type: AWS::SSM::Parameter::Value<List<AWS::EC2::Subnet::Id>>
    Default: /chemically/lambda/subnet_ids
    Description: Subnet IDs for Lambda VPC (from SSM)
  LambdaVpcId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::VPC::Id>
    Default: /chemically/lambda/vpc_id
    Description: VPC ID for Lambda security group (from SSM)
  EnvironmentVariablesBucket:
    Type: AWS::SSM::Parameter::Value<String>
    Default: /chemically/environment/bucket_name
    Description: S3 bucket name for environment variables (from SSM)

  # ─────────────────────────────────────────────
  # Edge abuse control (M006/S01, R026 / THROT-01)
  # ─────────────────────────────────────────────
  WafRateLimit:
    Type: Number
    Default: 2000
    MinValue: 10
    MaxValue: 2000000000
    Description: >
      Maximum number of requests, per source IP, that the CloudFront WAF
      rate-based rule allows within the 300-second (5 minute) evaluation
      window for the rate-limited paths (HPLC API and the equilibria
      calculator). Exposed as a parameter so the abuse ceiling stays
      reviewable and tunable without editing the template.

  # ─────────────────────────────────────────────
  # CloudFront origin header guard (M006/S03, R029 / THROT-04)
  # ─────────────────────────────────────────────
  # The Function URL is public (Principal "*"), so anybody who learns it can
  # call the app directly and skip CloudFront -- and with it every WAF rule.
  # CloudFront therefore stamps every origin request with a custom header
  # whose value is the shared secret below, and the Django guard refuses any
  # request that does not carry it.
  #
  # The VALUE of OriginSecret is never committed: it lives in CloudFormation
  # (NoEcho) and is supplied by the deploy pipeline. Only the parameter NAME
  # appears in this repository.
  OriginHeaderName:
    Type: String
    Default: X-ChemicAlly-Origin
    MinLength: 1
    Description: >
      Name of the custom header CloudFront stamps on every origin request.
      Must match ORIGIN_HEADER_NAME in config/settings/base.py.
  OriginSecret:
    Type: String
    NoEcho: true
    Description: >
      Shared secret proving a request came through CloudFront. Never commit
      this value: it lives in CloudFormation only.

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Environment:
      Variables:
        DJANGO_SETTINGS_MODULE: config.settings.production
        # CloudFront does not forward the viewer Host header (the Lambda
        # Function URL rejects a Host that is not its own domain), so Django
        # sees the Function URL host. Accept the apex/www hosts plus the
        # regional Function URL namespace. Referencing FunctionUrl directly
        # here would create a circular CloudFormation dependency.
        ALLOWED_HOSTS: !Sub ".${DomainName} .lambda-url.${AWS::Region}.on.aws"
        AWS_STORAGE_BUCKET_NAME: !Ref EnvironmentVariablesBucket
        AWS_S3_REGION_NAME: !Ref AWS::Region
        RDS_DB_NAME: !Ref RDSDBName
        RDS_USERNAME: !Ref RDSUsername
        RDS_PASSWORD: !Ref RDSPassword
        RDS_HOSTNAME: !Ref RDSHostname
        RDS_PORT: !Ref RDSPort
        SECRET_KEY: !Ref DjangoSecretKey
        # M006/S03 (R029): the origin header guard. The same value is set as
        # a CloudFront origin custom header below; a request that does not
        # carry it never came through CloudFront and is refused with 403.
        ORIGIN_HEADER_NAME: !Ref OriginHeaderName
        ORIGIN_HEADER_SECRET: !Ref OriginSecret

Resources:
  # ─────────────────────────────────────────────
  # ECR Repository for container images
  # ─────────────────────────────────────────────
  # ─────────────────────────────────────────────
  # Lambda execution role
  # ─────────────────────────────────────────────
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: S3Access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:DeleteObject
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${EnvironmentVariablesBucket}/*"
                  - !Sub "arn:aws:s3:::${EnvironmentVariablesBucket}"

  # ─────────────────────────────────────────────
  # Lambda function (container image)
  # ─────────────────────────────────────────────
  DjangoFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/chemically:${ImageTag}"
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt LambdaSecurityGroup.GroupId
        SubnetIds: !Ref LambdaSubnetIds
    Metadata:
      DockerTag: !Ref ImageTag
      DockerContext: .
      Dockerfile: Dockerfile

  # ─────────────────────────────────────────────
  # Migrator Lambda (D017, R011)
  #
  # Deployed from the same pushed Lambda image as DjangoFunction but runs
  # config.migrate.handler (migrate --noinput + createcachetable) instead of
  # the ASGI handler. Invoked by scripts/run_migrator.py from the deploy job,
  # which only calls it when an RDS instance is actually available (D006:
  # RDS is deliberately absent today, so no unconditional migrate step).
  # No Metadata block needed: the image is built/pushed by CI and deployed
  # via ``sam deploy`` with an explicit ImageUri (no ``sam build``).
  # ─────────────────────────────────────────────
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Role: !GetAtt LambdaExecutionRole.Arn
      ImageUri: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/chemically:${ImageTag}"
      ImageConfig:
        Command:
          - config.migrate.handler
      VpcConfig:
        SecurityGroupIds:
          - !GetAtt LambdaSecurityGroup.GroupId
        SubnetIds: !Ref LambdaSubnetIds

  # ─────────────────────────────────────────────
  # Lambda Function URL (public endpoint)
  # ─────────────────────────────────────────────
  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref DjangoFunction
      AuthType: NONE
      Cors:
        AllowOrigins:
          - !Sub "https://${DomainName}"
          - !Sub "https://www.${DomainName}"
        AllowMethods:
          - GET
          - POST
          - PUT
          - PATCH
          - DELETE
          - HEAD
        AllowHeaders:
          - Content-Type
          - X-CSRFToken
          - Authorization
        MaxAge: 86400

  FunctionUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DjangoFunction
      Action: lambda:InvokeFunctionUrl
      Principal: "*"
      FunctionUrlAuthType: NONE

  # A public (AuthType: NONE) function URL needs BOTH lambda:InvokeFunctionUrl
  # and lambda:InvokeFunction. AWS added the second requirement for new function
  # URLs in October 2025; without this statement every request to the URL fails
  # with 403 AccessDeniedException even though the auth-type condition matches.
  # The InvokedViaFunctionUrl condition keeps the grant scoped to URL calls.
  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref DjangoFunction
      Action: lambda:InvokeFunction
      Principal: "*"
      InvokedViaFunctionUrl: true

  # ─────────────────────────────────────────────
  # Security Group for Lambda VPC access (RDS)
  # ─────────────────────────────────────────────
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Security group for Django Lambda function
      VpcId: !Ref LambdaVpcId
      SecurityGroupIngress:
        - IpProtocol: -1
          CidrIp: 172.31.0.0/16
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ─────────────────────────────────────────────
  # CloudFront Distribution
  #
  # The ACM certificate (us-east-1, DNS-validated via Cloudflare) is
  # pre-provisioned out of band — see scripts/cloudflare_deploy.py — and
  # supplied as the CertificateArn parameter. Route53 is intentionally not
  # used; DNS for the domain lives in Cloudflare.
  # ─────────────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Aliases:
          - !Ref DomainName
          - !Sub "www.${DomainName}"
        PriceClass: PriceClass_100
        DefaultCacheBehavior:
          TargetOriginId: DjangoLambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
            - PUT
            - POST
            - PATCH
            - DELETE
          CachedMethods:
            - GET
            - HEAD
            - OPTIONS
          DefaultTTL: 0
          MaxTTL: 0
          MinTTL: 0
          ForwardedValues:
            QueryString: true
            Cookies:
              Forward: all
            # Host is intentionally NOT forwarded: the Lambda Function URL
            # requires Host to equal its own domain and returns 403 otherwise.
            # CloudFront therefore sends the origin domain as Host.
            Headers:
              - Origin
              - Authorization
              - X-CSRFToken
              - CloudFront-Forwarded-Proto
          Compress: true
        Enabled: true
        Origins:
          - Id: DjangoLambda
            DomainName: !Select [2, !Split ["/", !GetAtt FunctionUrl.FunctionUrl]]
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
            # M006/S03 (R029 / THROT-04): the origin header guard.
            # CloudFront adds this header to EVERY origin request with the
            # shared secret; Django refuses any request that arrives without
            # it, which closes the direct Function-URL bypass around the
            # WAF.
            #
            # The header is deliberately NOT in ForwardedValues.Headers above:
            # legacy forwarding is an allow-list, so a viewer cannot smuggle
            # its own copy of the header to the origin -- CloudFront's value
            # is the only one that arrives.
            OriginCustomHeaders:
              - HeaderName: !Ref OriginHeaderName
                HeaderValue: !Ref OriginSecret
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only

  # ─────────────────────────────────────────────
  # CloudFront WAF rate-based rule (M006/S01, R026 / THROT-01)
  #
  # Abuse is bounded at the edge: a request that trips the rate limit is
  # blocked by WAF before it ever reaches Lambda or the equilibria solver.
  #
  # Scope is deliberately narrow. The rule only counts requests to the
  # HPLC API paths and to the equilibria calculator, so ordinary browsing
  # of the landing page and of the simulator level pages is never
  # throttled. The rule is aggregated per source IP, which is the only
  # aggregation key available to a CloudFront-scoped rule.
  #
  # REGION CONSTRAINT (read before deploying): AWS WAF web ACLs with
  # Scope CLOUDFRONT can only be created in us-east-1 ("For CLOUDFRONT,
  # you must create your WAFv2 resources in the US East (N. Virginia)
  # Region, us-east-1" -- AWS::WAFv2::WebACL reference). This stack is
  # currently deployed to us-east-2 by .github/workflows/deploy.yml, so
  # the deploy of this stack must target us-east-1 for these two
  # resources. Moving the whole app stack is not an option (RDS and the
  # Lambda VPC live in us-east-2); the edge (CloudFront + WAF) is
  # therefore the piece that has to be deployed to us-east-1. See
  # OPS_PLAYBOOK.md and the M006 follow-up for the edge-stack split.
  # ─────────────────────────────────────────────
  WafWebACL:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-edge-rate-limit"
      Scope: CLOUDFRONT
      Description: >-
        Edge rate limit for the HPLC API and the equilibria calculator
        (M006/S01, R026).
      DefaultAction:
        Allow: {}
      # Required on the web ACL itself: enables the CloudWatch metric and
      # (sampled) request visibility for the rule below. Sampling is kept
      # off at the ACL level -- only the rule's own sampled-request
      # metric is on, and no request bodies are ever logged.
      VisibilityConfig:
        CloudWatchMetricsEnabled: true
        MetricName: ChemicAllyEdgeWebAcl
        SampledRequestsEnabled: false
      Rules:
        - Name: EdgeRateLimit
          Priority: 0
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimit
              # 300 s = the 5-minute evaluation window the limit is
              # measured over (AWS WAF allowed values: 60, 120, 300, 600).
              EvaluationWindowSec: 300
              AggregateKeyType: IP
              ScopeDownStatement:
                OrStatement:
                  Statements:
                    # HPLC API (simulate, scores, levels, progress).
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /hplc/api/
                        TextTransformation: NONE
                    # Equilibria calculator (the expensive solver path).
                    - ByteMatchStatement:
                        FieldToMatch:
                          UriPath: {}
                        PositionalConstraint: STARTS_WITH
                        SearchString: /calculate/equilibria
                        TextTransformation: NONE
          VisibilityConfig:
            CloudWatchMetricsEnabled: true
            MetricName: EdgeRateLimit
            SampledRequestsEnabled: true

  # The association is part of the same template and references the
  # distribution by Ref, so a distribution can never be deployed without
  # the rate rule attached to it (and the two cannot drift apart).
  WafWebACLAssociation:
    Type: AWS::WAFv2::WebACLAssociation
    Properties:
      WebACLArn: !GetAtt WafWebACL.Arn
      ResourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  # DNS (apex + www) is managed in Cloudflare, not Route53.
  # See scripts/cloudflare_deploy.py sync-records.

Outputs:
  FunctionUrl:
    Description: Lambda Function URL
    Value: !GetAtt FunctionUrl.FunctionUrl
  CloudFrontDomain:
    Description: CloudFront distribution domain name
    Value: !GetAtt CloudFrontDistribution.DomainName
  EcrRepositoryUri:
    Description: ECR repository URI for pushing images
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/chemically"
  LambdaFunctionArn:
    Description: Lambda function ARN
    Value: !GetAtt DjangoFunction.Arn
  MigrateFunctionArn:
    Description: Migrator Lambda function ARN (R011/D017)
    Value: !GetAtt MigrateFunction.Arn
