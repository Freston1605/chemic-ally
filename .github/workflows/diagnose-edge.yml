name: Diagnose edge association (temporary)

# TEMPORARY diagnostic. It prints the CloudFront distribution's own
# identifiers, then tries the association with several ARN shapes against
# ONE throwaway web ACL, and deletes that ACL again at the end.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Report the live state
        run: |
          set -uo pipefail
          dist_id=$(aws cloudformation describe-stacks --stack-name chemically \
            --region us-east-2 \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionArn'].OutputValue" \
            --output text | sed -e 's#.*distribution/##')
          echo "distribution id: ${dist_id}"

          echo "=== every top-level key of the distribution object ==="
          aws cloudfront get-distribution --id "$dist_id" --output json \
            | python3 -c '
          import json, sys
          data = json.load(sys.stdin)["Distribution"]
          print("keys: %s" % sorted(data.keys()))
          for key in sorted(data.keys()):
              if key in ("Id", "ARN", "Status", "DomainName", "LastModifiedTime",
                         "ActiveTrustedSigners", "WebACLId", "Restrictions"):
                  print("%s=%s" % (key, data.get(key)))
          '

          echo
          echo "=== the web ACLs currently in us-east-1 (CLOUDFRONT) ==="
          aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 \
            --output json --query 'WebACLs[].{name:Name,arn:ARN,scope:Scope,id:Id}'

          acl=$(aws wafv2 create-web-acl \
            --name chemically-diagnostic-association \
            --scope CLOUDFRONT \
            --default-action '{"Allow": {}}' \
            --visibility-config '{"CloudWatchMetricsEnabled": true, "MetricName": "ChemicAllyDiagnostic", "SampledRequestsEnabled": false}' \
            --region us-east-1 --output json \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["Summary"]["ARN"])')
          echo "throwaway acl: ${acl}"

          for variant in \
            "arn:aws:cloudfront::768125641662:distribution/${dist_id}" \
            "arn:aws:cloudfront:us-east-1:768125641662:distribution/${dist_id}" \
            "arn:aws:cloudfront::768125641662:distribution:${dist_id}" \
            "${dist_id}" ; do
            echo "--- trying: ${variant}"
            aws wafv2 associate-web-acl --web-acl-arn "$acl" --resource-arn "$variant" \
              --region us-east-1 2>&1 | grep -E "Reason|Parameter|error|Error|\{|\}" | head -6
            echo "--- exit: $?"
          done

          echo "=== cleaning up every throwaway ACL ==="
          for name in chemically-diagnostic-association; do
            for a in $(aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 \
                --output json --query "WebACLs[?Name=='$name'].ARN" --output text); do
              token=$(aws wafv2 get-web-acl --web-acl-arn "$a" --region us-east-1 \
                --output json --query 'LockToken' --output text)
              aws wafv2 delete-web-acl --web-acl-arn "$a" --lock-token "$token" \
                --region us-east-1 2>&1 | head -3
              echo "deleted ${a}"
            done
          done
          echo "=== remaining CLOUDFRONT ACLs ==="
          aws wafv2 list-web-acls --scope CLOUDFRONT --region us-east-1 \
            --output json --query 'WebACLs[].Name'
