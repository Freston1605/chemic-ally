name: Diagnose edge association (temporary)

# TEMPORARY diagnostic: the decisive comparison. The live distribution's ARN
# is tried against a REGIONAL-scope web ACL (us-east-2) and a
# CLOUDFRONT-scope web ACL (us-east-1), with several ARN shapes. Every
# throwaway ACL - including leftovers from earlier runs - is deleted at the
# end.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Diagnose
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (us-east-2)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Install boto3
        run: pip install --quiet boto3

      - name: Report the live state
        run: |
          python3 - <<'PY'
          import boto3
          from botocore.exceptions import BotoCoreError, ClientError

          def client(service, region):
              return boto3.client(service, region_name=region)

          cfn = client("cloudformation", "us-east-2")
          stack = cfn.describe_stacks(StackName="chemically")["Stacks"][0]
          outputs = {o["OutputKey"]: o["OutputValue"] for o in stack["Outputs"]}
          arn = outputs["DistributionArn"]
          dist_id = arn.rsplit("/", 1)[-1]
          print("RESULT stack status:", stack["StackStatus"])
          print("RESULT pipeline arn:", repr(arn))
          print("RESULT distribution id length:", len(dist_id))

          waf_e1 = client("wafv2", "us-east-1")
          waf_e2 = client("wafv2", "us-east-2")

          def delete_all(waf, scope):
              for acl in waf.list_web_acls(Scope=scope).get("WebACLs", []):
                  if "chemically-diagnostic" not in acl["Name"]:
                      continue
                  try:
                      lock = waf.get_web_acl(WebACLArn=acl["ARN"])["LockToken"]
                      waf.delete_web_acl(WebACLArn=acl["ARN"], LockToken=lock)
                      print("RESULT deleted leftover", acl["ARN"])
                  except Exception as exc:
                      print("RESULT leftover not deleted", acl["ARN"], str(exc)[:140])

          delete_all(waf_e1, "CLOUDFRONT")
          delete_all(waf_e2, "REGIONAL")

          made = []

          def make(waf, scope, name, metric):
              try:
                  acl = waf.create_web_acl(
                      Name=name,
                      Scope=scope,
                      DefaultAction={"Allow": {}},
                      VisibilityConfig={
                          "CloudWatchMetricsEnabled": True,
                          "MetricName": metric,
                          "SampledRequestsEnabled": False,
                      },
                  )["Summary"]["ARN"]
                  made.append((waf, acl))
                  print("RESULT created", scope, name, acl)
                  return acl
              except Exception as exc:
                  print("RESULT could not create", scope, name, str(exc)[:200])
                  return None

          acl_cf = make(waf_e1, "CLOUDFRONT",
                        "chemically-diagnostic-cf", "ChemicAllyDiagCf")
          acl_reg = make(waf_e2, "REGIONAL",
                         "chemically-diagnostic-regional", "ChemicAllyDiagReg")

          variants = [
              ("as-is", arn),
              ("with-region", arn.replace("::", ":us-east-1:")),
          ]
          for label, waf, acl in (
              ("reg-scope/us-east-2", waf_e2, acl_reg),
              ("cf-scope/us-east-1", waf_e1, acl_cf),
          ):
              if not acl:
                  continue
              for name, candidate in variants:
                  try:
                      waf.associate_web_acl(WebACLArn=acl, ResourceArn=candidate)
                      print("RESULT OK", label, name, candidate)
                  except Exception as exc:
                      code = ""
                      if isinstance(exc, ClientError):
                          code = exc.response["Error"].get("Code", "")
                      print("RESULT FAIL", label, name, code, str(exc)[:200])

          for waf, acl in made:
              try:
                  lock = waf.get_web_acl(WebACLArn=acl)["LockToken"]
                  waf.delete_web_acl(WebACLArn=acl, LockToken=lock)
                  print("RESULT deleted", acl)
              except Exception as exc:
                  print("RESULT could not delete", acl, str(exc)[:160])
          print("RESULT DONE")
          PY
