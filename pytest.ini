[pytest]
DJANGO_SETTINGS_MODULE = config.settings.development
pythonpath = .
python_files = test_*.py *_test.py
# R016: base.py has no SECRET_KEY fallback and raises ImproperlyConfigured when
# it is unset. pytest-env supplies an explicit, obviously-insecure key so the
# suite never depends on a developer's ambient environment or a stray .env.
env = D:SECRET_KEY=test-only-insecure-key-0123456789-abcdefghij
markers =
    throttle_enabled: keep the configured DRF throttles active for this test/module. The suite disables throttling by default (so it can never self-429); the dedicated throttle modules opt back in with this marker.
